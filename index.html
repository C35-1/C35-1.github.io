<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Anniversaires à Venir</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --accent-red: #e50914;
            --accent-red-light: #ff3d47;
            --accent-purple: #b4a7d6;
            --accent-gold: #c9a227;
            --text-primary: #ffffff;
            --text-secondary: #808080;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.3;
            animation: float 25s ease-in-out infinite;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: #e50914;
            top: -300px;
            right: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #831010;
            bottom: -200px;
            left: -200px;
            animation-delay: -8s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: #e50914;
            top: 50%;
            left: 50%;
            opacity: 0.15;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(60px, -40px) scale(1.1) rotate(5deg); }
            50% { transform: translate(-40px, 60px) scale(0.95) rotate(-5deg); }
            75% { transform: translate(-60px, -30px) scale(1.05) rotate(3deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -1px;
            text-shadow: 0 0 40px rgba(229, 9, 20, 0.5);
        }

        .subtitle {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .stats-section {
            margin-bottom: 50px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(229, 9, 20, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-red);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-sublabel {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
            opacity: 0.7;
        }

        .today-section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
        }

        .section-title .emoji {
            font-size: 1.3rem;
        }

        .birthday-today {
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.2), rgba(131, 16, 16, 0.15), rgba(0, 0, 0, 0.3));
            border: 1px solid rgba(229, 9, 20, 0.5);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            animation: pulse-glow 3s ease-in-out infinite, fadeInUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .birthday-today::before {
            content: '🎉';
            position: absolute;
            font-size: 10rem;
            opacity: 0.05;
            right: -30px;
            top: -30px;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 30px rgba(229, 9, 20, 0.2); }
            50% { box-shadow: 0 0 50px rgba(229, 9, 20, 0.4); }
        }

        .birthday-today .avatar {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--accent-red);
            flex-shrink: 0;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.4);
        }

        .birthday-today .avatar-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.4);
        }

        .birthday-today .info h3 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #ffffff;
            font-weight: 700;
        }

        .birthday-today .info .today-main {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .birthday-today .info .age-highlight {
            color: var(--accent-red);
            font-weight: 700;
            font-size: 1.3rem;
        }

        .birthday-today .info .today-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 8px;
        }

        .birthday-today .info .detail-item {
            color: var(--text-secondary);
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .birthday-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        .birthday-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            gap: 20px;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out backwards;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .birthday-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-red), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .birthday-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.08), transparent 50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .birthday-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(229, 9, 20, 0.15);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
        }

        .birthday-card:hover::before,
        .birthday-card:hover::after {
            opacity: 1;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-container {
            position: relative;
            flex-shrink: 0;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            border: none;
            background: var(--bg-card);
            transition: all 0.3s ease;
        }

        .birthday-card:hover .avatar {
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        .avatar-placeholder {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            background: linear-gradient(135deg, #e50914, #831010);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .pseudo {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .birthday-date {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info {
            margin-bottom: 15px;
        }

        .age-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .current-age {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .arrow {
            font-weight: bold;
            color: var(--text-secondary);
        }

        .upcoming-age {
            background: rgba(58, 58, 58, 0.479);
            padding: 3px 10px;
            box-shadow: inset 0 0 5px rgb(255, 255, 255);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .age-badge {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .countdown {
            display: flex;
            gap: 8px;
        }

        .countdown-item {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 10px 8px;
            border-radius: 8px;
            min-width: 50px;
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .countdown-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
        }

        .countdown-label {
            font-size: 0.55rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 3px;
        }

        .no-birthdays {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* ============================================
           TOP 3 SECTION - HBO MAX STYLE 
        ============================================ */
        .top3-section { margin-bottom: 50px; }

        .top3-list {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 20px 0;
            scrollbar-width: none;
        }
        .top3-list::-webkit-scrollbar { display: none; }

        .top3-tile-wrapper {
            transition: transform 0.3s ease;
            position: relative;
        } 

        .top3-tile-wrapper:hover {
            transform: translateY(-5px);
        }

        .top3-tile-link {
            display: flex;
            align-items: flex-end;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }
        .top3-tile-link:hover { transform: scale(1.05); }

        .top3-rank-container {
            position: relative;
            flex-shrink: 0;
            margin-right: -16px;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            padding-bottom: 10px;
            width: 120px;
            transition: transform 0.3s ease;
        }

        .top3-tile-wrapper:hover .top3-rank-container {
            transform: translateX(-15px);
        }

        .top3-tile-wrapper:hover .top3-image-container {
            box-shadow: 0 0 0px rgba(0, 0, 0, 0.1);
        }

        .rank-image {
            width: 100%;
            height: auto;
            filter: drop-shadow(3px 4px 6px rgba(0,0,0,0.6));
        }

        .top3-image-container {
            position: relative;
            width: 300px;
            height: auto;
            border-radius: 12px;
            overflow: hidden;
            background: #0d0d0d;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
            isolation: isolate;
        }

        .top3-image-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            pointer-events: none;
            z-index: 15;
        }

        .top3-tile-image {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
        }

        .top3-tile-placeholder {
            width: 100%;
            aspect-ratio: 2/3;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: 700;
            color: rgba(255,255,255,0.08);
        }

        .top3-tile-overlays {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(
                to top,
                rgba(30,30,35,1) 0%,
                rgba(30,30,35,0.95) 20%, 
                rgba(30,30,35,0.9) 40%, 
                rgba(30,30,35,0.7) 60%, 
                rgba(30,30,35,0.4) 80%, 
                transparent 100%
            );
            z-index: 10;
        }

        .top3-tile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .top3-tile-name {
            font-size: 1.2rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top3-age-badge {
            background: rgba(58, 58, 58, 0.479);
            padding: 3px 10px;
            box-shadow: inset 0 0 5px rgb(0, 0, 0);
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 1000;
        }

        .top3-tile-date {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top3-countdown {
            display: flex;
            gap: 6px;
        }

        .top3-countdown-item {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 0;
            border-radius: 6px;
            text-align: center;
            flex: 1;
        }

        .top3-countdown-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .top3-countdown-label {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ============================================
           SHARE CARD STYLES
        ============================================ */
        .share-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .share-btn-primary {
            background: linear-gradient(135deg, #e50914, #b20710);
            color: white;
        }

        .share-btn-primary:hover {
            background: linear-gradient(135deg, #ff3d47, #e50914);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(229, 9, 20, 0.4);
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            border: 1px solid rgba(229, 9, 20, 0.3);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(229, 9, 20, 0.5);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Share Card Preview - Canvas uniquement */
        .share-card-preview {
            position: relative;
            width: 300px;
            height: 450px;
            margin: 0 auto 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #0d0d0d;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
        }

        .share-card-canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }

        .generating-text {
            text-align: center;
            padding: 10px;
            color: var(--accent-red);
            font-weight: 600;
            display: none;
        }

        .generating-text.active {
            display: block;
        }

        .share-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .share-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .share-action-btn.download {
            background: linear-gradient(135deg, #e50914, #b20710);
            color: white;
        }

        .share-action-btn.download:hover {
            background: linear-gradient(135deg, #ff3d47, #e50914);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(229, 9, 20, 0.4);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 3000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px 10px;
            }

            header .title {
                font-size: clamp(2rem, 8vw, 3rem);
            }

            header .subtitle {
                font-size: 0.9rem;
            }

            .birthday-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .birthday-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 20px;
            }

            .birthday-card .card-content {
                width: 100%;
            }

            .birthday-card .avatar, .birthday-today .avatar {
                width: 80px;
                height: 80px;
            }

            .birthday-today {
                flex-direction: column;
                text-align: center;
            }

            .today-details {
                justify-content: center;
            }

            .countdown {
                justify-content: center;
                gap: 5px;
            }

            .countdown-item {
                padding: 8px 6px;
                min-width: 40px;
            }

            .countdown-value {
                font-size: 1.2rem;
            }

            .countdown-label {
                font-size: 0.5rem;
            }

            .stats-grid {

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <script>
        // ============================================
        // SYSTÈME DE CONFETTIS RÉALISTES (Canvas)
        // ============================================
        class Confetti {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.colors = [
                    '#e50914', '#ff3d47', '#b20710', '#ffffff', '#cccccc', 
                    '#ff6b6b', '#c9a227', '#ffd700', '#ff4444', '#ff8080'
                ];
                this.running = false;
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            createParticle(x, y, isExplosion = false) {
                const color = this.colors[Math.floor(Math.random() * this.colors.length)];
                const shapeType = Math.random();
                let shape;
                if (shapeType < 0.3) shape = 'square';
                else if (shapeType < 0.5) shape = 'circle';
                else if (shapeType < 0.8) shape = 'ribbon';
                else shape = 'star';
                
                return {
                    x: x !== undefined ? x : Math.random() * this.canvas.width,
                    y: y !== undefined ? y : -20,
                    width: Math.random() * 12 + 6,
                    height: Math.random() * 8 + 4,
                    color: color,
                    shape: shape,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 15,
                    velocityX: isExplosion ? (Math.random() - 0.5) * 25 : (Math.random() - 0.5) * 4,
                    velocityY: isExplosion ? Math.random() * -18 - 8 : Math.random() * 3 + 2,
                    gravity: 0.12,
                    drag: 0.99,
                    opacity: 1,
                    wobble: Math.random() * 10,
                    wobbleSpeed: Math.random() * 0.15 + 0.05,
                    scale: isExplosion ? Math.random() * 0.5 + 0.8 : 1,
                    tilt: Math.random() * Math.PI
                };
            }

            drawParticle(p) {
                this.ctx.save();
                this.ctx.translate(p.x, p.y);
                this.ctx.rotate(p.rotation * Math.PI / 180);
                this.ctx.scale(p.scale, p.scale * Math.cos(p.tilt));
                this.ctx.globalAlpha = p.opacity;
                this.ctx.fillStyle = p.color;

                switch(p.shape) {
                    case 'square':
                        this.ctx.fillRect(-p.width / 2, -p.height / 2, p.width, p.height);
                        break;
                    case 'circle':
                        this.ctx.beginPath();
                        this.ctx.arc(0, 0, p.width / 2, 0, Math.PI * 2);
                        this.ctx.fill();
                        break;
                    case 'ribbon':
                        this.ctx.beginPath();
                        this.ctx.moveTo(-p.width / 2, -p.height / 2);
                        this.ctx.lineTo(p.width / 2, -p.height / 4);
                        this.ctx.lineTo(p.width / 2, p.height / 2);
                        this.ctx.lineTo(-p.width / 2, p.height / 4);
                        this.ctx.closePath();
                        this.ctx.fill();
                        break;
                    case 'star':
                        this.drawStar(0, 0, 5, p.width / 2, p.width / 4);
                        break;
                }

                this.ctx.restore();
            }

            drawStar(cx, cy, spikes, outerRadius, innerRadius) {
                let rot = Math.PI / 2 * 3;
                let step = Math.PI / spikes;

                this.ctx.beginPath();
                this.ctx.moveTo(cx, cy - outerRadius);

                for (let i = 0; i < spikes; i++) {
                    let x = cx + Math.cos(rot) * outerRadius;
                    let y = cy + Math.sin(rot) * outerRadius;
                    this.ctx.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    this.ctx.lineTo(x, y);
                    rot += step;
                }

                this.ctx.lineTo(cx, cy - outerRadius);
                this.ctx.closePath();
                this.ctx.fill();
            }

            updateParticle(p) {
                p.velocityY += p.gravity;
                p.velocityX *= p.drag;
                p.velocityY *= p.drag;

                p.x += p.velocityX + Math.sin(p.wobble) * 2;
                p.y += p.velocityY;
                p.rotation += p.rotationSpeed;
                p.wobble += p.wobbleSpeed;
                p.tilt += 0.05;

                if (p.y > this.canvas.height - 150) {
                    p.opacity -= 0.015;
                }

                return p.y < this.canvas.height + 50 && p.opacity > 0;
            }

            burst(x, y, count = 60) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(this.createParticle(x, y, true));
                }
            }

            startContinuous() {
                this.running = true;
                this.continuousInterval = setInterval(() => {
                    if (this.running && this.particles.length < 200) {
                        this.particles.push(this.createParticle());
                        if (Math.random() > 0.5) {
                            this.particles.push(this.createParticle());
                        }
                    }
                }, 80);
            }

            stop() {
                this.running = false;
                clearInterval(this.continuousInterval);
                clearInterval(this.burstInterval);
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.particles = this.particles.filter(p => {
                    this.drawParticle(p);
                    return this.updateParticle(p);
                });

                requestAnimationFrame(() => this.animate());
            }

            start() {
                this.animate();
                this.startContinuous();
                
                this.burstInterval = setInterval(() => {
                    if (this.running) {
                        const side = Math.random() > 0.5;
                        const x = side ? this.canvas.width * 0.1 : this.canvas.width * 0.9;
                        this.burst(x, this.canvas.height * 0.3, 40);
                    }
                }, 4000);

                setTimeout(() => {
                    this.burst(this.canvas.width * 0.3, this.canvas.height * 0.2, 70);
                }, 300);
                setTimeout(() => {
                    this.burst(this.canvas.width * 0.7, this.canvas.height * 0.25, 70);
                }, 600);
                setTimeout(() => {
                    this.burst(this.canvas.width * 0.5, this.canvas.height * 0.15, 80);
                }, 900);
            }
        }

        // ============================================
        // ÉTOILES SCINTILLANTES
        // ============================================

        }

        // ============================================
        // DONNÉES UTILISATEURS
        // ============================================
        const today = new Date();
        
        // Liste de tous les avatars disponibles
        const availableAvatars = [

        // Fonction pour générer un hash à partir d'une string
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash);
        }
        
        // Fonction pour obtenir un avatar aléatoire mais consistant par jour
        function getRandomAvatar(pseudo) {

            return availableAvatars[index];

        const users = [
            // UTILISATEUR TEST - ANNIVERSAIRE AUJOURD'HUI
            //{ pseudo: "Test USER", birthday: { day: today.getDate(), month: today.getMonth() + 1, hour: 0, minute: 0, second: 0, year: 1995 } },

            { pseudo: "Nicolas DIMOND", birthday: { day: 9, month: 3, hour:0, minute:0, second:0, year:1991 } },
            { pseudo: "Zallif ZOAHOUI", birthday: { day: 16, month: 3, hour:0, minute:0, second:0, year:1971 } },
            { pseudo: "Frédéric NGUYEN", birthday: { day: 29, month: 4, hour:0, minute:0, second:0, year:1977 } },
            { pseudo: "Nadejki COUDAUX", birthday: { day: 28, month: 6, hour:0, minute:0, second:0, year:1985 } },
            { pseudo: "David DA COSTA", birthday: { day: 1, month: 7, hour:0, minute:0, second:0, year:1985 } },
            { pseudo: "Christophe DE BIASI", birthday: { day: 3, month: 7, hour:0, minute:0, second:0, year:1979 } },
            { pseudo: "Laurent NARDI", birthday: { day: 17, month: 11, hour:0, minute:0, second:0, year:1986 } },
            { pseudo: "Abdelhak HAMADOUCHE", birthday: { day: 9, month: 7, hour:0, minute:0, second:0, year:1980 } },
            { pseudo: "Thomas CHOQUET (parti)", birthday: { day: 18, month: 8, hour:0, minute:0, second:0, year:2002 } },
            { pseudo: "Mathieu AUGE", birthday: { day: 25, month: 9, hour:0, minute:0, second:0, year:1990 } },
            { pseudo: "Clément SAURA", birthday: { day: 13, month: 11, hour:0, minute:0, second:0, year:1987 } },
            { pseudo: "Lorenzo MONFORTE", birthday: { day: 27, month: 9, hour:0, minute:0, second:0, year:2007 } },
            { pseudo: "Alexia BORDENAVE", birthday: { day: 11, month: 9, hour:0, minute:0, second:0, year:2002 } },
            { pseudo: "Edgar FRANCOISE (SLS)", birthday: { day: 21, month: 2, hour:0, minute:0, second:0, year:1992 } },
        ];
        
        // Ajouter automatiquement un avatar à chaque utilisateur
        users.forEach(user => {
            user.avatar = getRandomAvatar(user.pseudo);
        });

        const monthNames = [
            'janvier', 'février', 'mars', 'avril', 'mai', 'juin',
            'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'
        ];

        // Variables pour le partage
        let currentShareUser = null;
        let cardConfetti = null;
        let cardAnimationId = null;

        // ============================================
        // CLASSE CARD RENDERER - DESSINE TOUT SUR CANVAS
        // ============================================
        class CardRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.colors = [
                    '#e50914', '#ff3d47', '#b20710', '#ffffff', '#cccccc', 
                    '#ff6b6b', '#c9a227', '#ffd700', '#ff4444', '#ff8080'
                ];
                this.running = false;
                this.image = null;
                this.imageLoaded = false;
                this.userName = '';
                this.userAge = 0;
                this.userInitial = '';
                
                // Dimensions fixes de la carte
                this.width = 300;
                this.height = 450;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.borderRadius = 16;
            }

            setUser(user) {
                this.userName = user.pseudo; // Pseudo entier
                this.userAge = getAge(user.birthday);
                this.userInitial = user.pseudo.charAt(0).toUpperCase();
                
                // Charger l'image
                if (user.avatar) {
                    this.image = new Image();
                    this.image.crossOrigin = 'anonymous';
                    this.image.onload = () => {
                        this.imageLoaded = true;
                    };
                    this.image.onerror = () => {
                        this.imageLoaded = false;
                        this.image = null;
                    };
                    this.image.src = user.avatar;
                } else {
                    this.image = null;
                    this.imageLoaded = false;
                }
            }

            createParticle(fromTop = true) {
                const color = this.colors[Math.floor(Math.random() * this.colors.length)];
                const shapes = ['square', 'circle', 'ribbon', 'star'];
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                
                return {
                    x: Math.random() * this.width,
                    y: fromTop ? -10 : Math.random() * this.height * 0.6,
                    width: Math.random() * 10 + 5,
                    height: Math.random() * 8 + 4,
                    color: color,
                    shape: shape,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 6, // Rotation plus lente
                    velocityX: (Math.random() - 0.5) * 1, // Moins de mouvement horizontal
                    velocityY: Math.random() * 0.8 + 0.3, // Chute plus lente
                    gravity: 0.015, // Gravité réduite
                    drag: 0.998,
                    opacity: 1,
                    wobble: Math.random() * 10,
                    wobbleSpeed: Math.random() * 0.04 + 0.01, // Oscillation plus lente
                    tilt: Math.random() * Math.PI
                };
            }

            drawRoundedRect(x, y, w, h, r) {
                this.ctx.beginPath();
                this.ctx.moveTo(x + r, y);
                this.ctx.lineTo(x + w - r, y);
                this.ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                this.ctx.lineTo(x + w, y + h - r);
                this.ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.ctx.lineTo(x + r, y + h);
                this.ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                this.ctx.lineTo(x, y + r);
                this.ctx.quadraticCurveTo(x, y, x + r, y);
                this.ctx.closePath();
            }

            drawCard() {
                const ctx = this.ctx;
                
                ctx.clearRect(0, 0, this.width, this.height);
                ctx.save();
                
                // Masque arrondi
                this.drawRoundedRect(0, 0, this.width, this.height, this.borderRadius);
                ctx.clip();
                
                // === FOND PRINCIPAL ===
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, this.width, this.height);
                
                // === IMAGE (partie haute) ===
                const imageHeight = 280;
                if (this.image && this.imageLoaded) {
                    const imgRatio = this.image.width / this.image.height;
                    const cardRatio = this.width / imageHeight;
                    let drawWidth, drawHeight, drawX, drawY;
                    
                    if (imgRatio > cardRatio) {
                        drawHeight = imageHeight;
                        drawWidth = this.image.width * (imageHeight / this.image.height);
                        drawX = (this.width - drawWidth) / 2;
                        drawY = 0;
                    } else {
                        drawWidth = this.width;
                        drawHeight = this.image.height * (this.width / this.image.width);
                        drawX = 0;
                        drawY = 0;
                    }
                    ctx.drawImage(this.image, drawX, drawY, drawWidth, drawHeight);
                } else {
                    // Placeholder stylé
                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(0, 0, this.width, imageHeight);
                    
                    ctx.fillStyle = 'rgba(229, 9, 20, 0.3)';
                    ctx.font = 'bold 120px Outfit, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.userInitial, this.width / 2, imageHeight / 2);
                }
                
                // === ZONE INFOS (fond solide) ===
                const infoBoxY = imageHeight - 10;
                const infoBoxHeight = this.height - infoBoxY;
                
                // Fond solide noir
                ctx.fillStyle = '#0d0d0d';
                ctx.fillRect(0, infoBoxY, this.width, infoBoxHeight);
                
                // Ligne rouge en haut de la zone info
                ctx.fillStyle = '#e50914';
                ctx.fillRect(0, infoBoxY, this.width, 3);
                
                // === CONFETTIS (au dessus de l'image, en dessous du texte) ===
                this.particles.forEach(p => this.drawParticle(p));
                
                // === BADGE D'ÂGE (en haut à droite) ===
                const badgeText = `${this.userAge} ans`;
                ctx.font = 'bold 16px Outfit, sans-serif';
                const badgeWidth = ctx.measureText(badgeText).width + 24;
                const badgeHeight = 32;
                const badgeX = this.width - badgeWidth - 12;
                const badgeY = 12;
                
                // Fond du badge
                ctx.fillStyle = '#e50914';
                this.drawRoundedRect(badgeX, badgeY, badgeWidth, badgeHeight, 16);
                ctx.fill();
                
                // Texte du badge
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Outfit, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(badgeText, badgeX + badgeWidth / 2, badgeY + badgeHeight / 2);
                
                // === EMOJI GATEAU ===
                ctx.font = '36px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('🎂', 20, infoBoxY + 45);
                
                // === NOM (taille adaptative) ===
                ctx.fillStyle = '#ffffff';
                let fontSize = 24;
                ctx.font = `bold ${fontSize}px Outfit, sans-serif`;
                
                // Réduire la taille si le nom est trop long
                while (ctx.measureText(this.userName).width > this.width - 90 && fontSize > 14) {
                    fontSize -= 2;
                    ctx.font = `bold ${fontSize}px Outfit, sans-serif`;
                }
                
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.userName, 65, infoBoxY + 38);
                
                // === MESSAGE ===
                ctx.fillStyle = '#e50914';
                ctx.font = 'bold 13px Outfit, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('JOYEUX ANNIVERSAIRE !', 65, infoBoxY + 60);
                
                // === LIGNE SÉPARATRICE ===
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(20, infoBoxY + 80);
                ctx.lineTo(this.width - 20, infoBoxY + 80);
                ctx.stroke();
                
                // === INFOS SUPPLÉMENTAIRES ===
                const today = new Date();
                const dateStr = `${today.getDate()} ${monthNames[today.getMonth()]} ${today.getFullYear()}`;
                
                // Icône calendrier + date
                ctx.font = '14px Arial';
                ctx.fillText('📅', 20, infoBoxY + 105);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '13px Outfit, sans-serif';
                ctx.fillText(dateStr, 45, infoBoxY + 105);
                
                // Icône étoile + message
                ctx.font = '14px Arial';
                ctx.fillText('⭐', 20, infoBoxY + 130);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '13px Outfit, sans-serif';
                ctx.fillText(`Fête ses ${this.userAge} ans aujourd'hui`, 45, infoBoxY + 130);
                
                // === BORDURE CARD ===
                ctx.strokeStyle = 'rgba(229, 9, 20, 0.3)';
                ctx.lineWidth = 2;
                this.drawRoundedRect(1, 1, this.width - 2, this.height - 2, this.borderRadius);
                ctx.stroke();
                
                ctx.restore();
            }

            drawParticle(p) {
                const ctx = this.ctx;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.scale(1, Math.cos(p.tilt));
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = p.color;

                switch(p.shape) {
                    case 'square':
                        ctx.fillRect(-p.width / 2, -p.height / 2, p.width, p.height);
                        break;
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(0, 0, p.width / 2, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'ribbon':
                        ctx.beginPath();
                        ctx.moveTo(-p.width / 2, -p.height / 2);
                        ctx.lineTo(p.width / 2, -p.height / 4);
                        ctx.lineTo(p.width / 2, p.height / 2);
                        ctx.lineTo(-p.width / 2, p.height / 4);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 'star':
                        this.drawStar(0, 0, 5, p.width / 2, p.width / 4);
                        break;
                }
                ctx.restore();
            }
            
            drawStar(cx, cy, spikes, outerRadius, innerRadius) {
                const ctx = this.ctx;
                let rot = Math.PI / 2 * 3;
                let step = Math.PI / spikes;

                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);

                for (let i = 0; i < spikes; i++) {
                    let x = cx + Math.cos(rot) * outerRadius;
                    let y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }

                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fill();
            }

            updateParticle(p) {
                p.velocityY += p.gravity;
                p.velocityX *= p.drag;
                p.velocityY *= p.drag;
                p.x += p.velocityX + Math.sin(p.wobble) * 0.6; // Oscillation réduite
                p.y += p.velocityY;
                p.rotation += p.rotationSpeed;
                p.wobble += p.wobbleSpeed;
                p.tilt += 0.01; // Tilt plus lent

                // Fade out près du bas
                if (p.y > this.height - 80) {
                    p.opacity -= 0.02;
                }

                return p.y < this.height + 20 && p.opacity > 0;
            }

            animate() {
                if (this.running && this.particles.length < 80 && Math.random() > 0.6) {
                    this.particles.push(this.createParticle(true));
                }

                this.particles = this.particles.filter(p => this.updateParticle(p));
                this.drawCard();

                if (this.running) {
                    cardAnimationId = requestAnimationFrame(() => this.animate());
                }
            }

            start() {
                this.running = true;
                for (let i = 0; i < 40; i++) {
                    this.particles.push(this.createParticle(false));
                }
                this.animate();
            }

            stop() {
                this.running = false;
                if (cardAnimationId) {
                    cancelAnimationFrame(cardAnimationId);
                }
            }

            clear() {
                this.particles = [];
                this.ctx.clearRect(0, 0, this.width, this.height);
            }
            
            getFrame() {
                return this.canvas;
            }
        }

        function getNextBirthday(birthday) {
            const now = new Date();
            const thisYear = now.getFullYear();
            let nextBirthday = new Date(thisYear, birthday.month - 1, birthday.day);
            
            if (nextBirthday < now && !(nextBirthday.toDateString() === now.toDateString())) {
                nextBirthday = new Date(thisYear + 1, birthday.month - 1, birthday.day);
            }
            
            return nextBirthday;
        }

        function getAge(birthday) {
            const now = new Date();
            let age = now.getFullYear() - birthday.year;
            const monthDiff = now.getMonth() + 1 - birthday.month;
            if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < birthday.day)) {
                age--;
            }
            return age;
        }

        function isBirthdayToday(birthday) {
            const now = new Date();
            return birthday.day === now.getDate() && birthday.month === (now.getMonth() + 1);
        }

        function getCountdown(targetDate) {
            const now = new Date();
            const diff = targetDate - now;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            return { days, hours, minutes, seconds };
        }

        function createAvatarHTML(user, size = 75) {
            if (user.avatar) {
                return `<img src="${user.avatar}" alt="${user.pseudo}" class="avatar" style="width: ${size}px; height: ${size}px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="avatar-placeholder" style="display: none; width: ${size}px; height: ${size}px;">${user.pseudo.charAt(0).toUpperCase()}</div>`;
            }
            return `<div class="avatar-placeholder" style="width: ${size}px; height: ${size}px;">${user.pseudo.charAt(0).toUpperCase()}</div>`;
        }

        function formatPseudo(user) {
            const parts = user.pseudo.trim().split(' ');
            if (parts.length === 1) return parts[0];
            const firstName = parts[0];
            const lastInitial = parts[1].charAt(0).toUpperCase();
            return `${firstName} ${lastInitial}.`;
        }

        // ============================================
        // FONCTIONS DE PARTAGE
        // ============================================
        function openShareModal(user) {
            currentShareUser = user;
            
            document.getElementById('share-modal').classList.add('active');
            
            // Démarrer le rendu de la carte sur le canvas
            setTimeout(() => {
                const cardCanvas = document.getElementById('card-confetti-canvas');
                if (cardConfetti) {
                    cardConfetti.stop();
                    cardConfetti.clear();
                }
                cardConfetti = new CardRenderer(cardCanvas);
                cardConfetti.setUser(user);
                
                // Attendre que l'image soit chargée
                setTimeout(() => {
                    cardConfetti.start();
                }, 200);
            }, 100);
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.remove('active');
            if (cardConfetti) {
                cardConfetti.stop();
                cardConfetti.clear();
            }
            currentShareUser = null;
        }

        async function downloadGif() {
            const generatingText = document.getElementById('generating-text');
            generatingText.classList.add('active');
            showToast('Capture en cours... 📸');

            try {
                // Capturer les frames directement depuis le canvas
                const frames = [];
                const totalFrames = 60; // 60 frames pour 60 FPS
                
                for (let i = 0; i < totalFrames; i++) {
                    await new Promise(resolve => setTimeout(resolve, 16)); // ~60fps de capture (1000/60 ≈ 16ms)
                    
                    // Copier le canvas actuel
                    const frameCanvas = document.createElement('canvas');
                    frameCanvas.width = cardConfetti.width;
                    frameCanvas.height = cardConfetti.height;
                    const frameCtx = frameCanvas.getContext('2d');
                    frameCtx.drawImage(cardConfetti.canvas, 0, 0);
                    
                    frames.push(frameCanvas);
                }

                showToast('Création du GIF... ⏳');

                // Créer le worker blob pour éviter CORS
                const workerCode = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js').then(r => r.text());
                const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(workerBlob);

                const gif = new GIF({
                    workers: 4,
                    quality: 1, // Meilleure qualité (1 = max)
                    width: cardConfetti.width,
                    height: cardConfetti.height,
                    workerScript: workerUrl,
                    transparent: null,
                    dither: 'FloydSteinberg' // Dithering pour éviter les bandes
                });

                frames.forEach(frame => {
                    gif.addFrame(frame, { delay: 16, copy: true }); // 16ms = ~60fps
                });

                gif.on('finished', function(blob) {
                    URL.revokeObjectURL(workerUrl);
                    
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `anniversaire-${formatPseudo(currentShareUser).replace(/\s+/g, '-')}.gif`;
                    link.href = url;
                    link.click();
                    
                    setTimeout(() => URL.revokeObjectURL(url), 100);
                    
                    generatingText.classList.remove('active');
                    showToast('GIF téléchargé ! 🎬');
                });

                gif.on('error', function(err) {
                    console.error('GIF error:', err);
                    URL.revokeObjectURL(workerUrl);
                    fallbackToPng();
                });

                gif.render();

            } catch (error) {
                console.error('Erreur GIF:', error);
                fallbackToPng();
            }
        }

        async function fallbackToPng() {
            const generatingText = document.getElementById('generating-text');
            generatingText.classList.remove('active');
            showToast('Téléchargement PNG...');
            
            try {
                const link = document.createElement('a');
                link.download = `anniversaire-${formatPseudo(currentShareUser).replace(/\s+/g, '-')}.png`;
                link.href = cardConfetti.canvas.toDataURL('image/png');
                link.click();
            } catch (e) {
                showToast('Erreur lors du téléchargement');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('active');
            
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Fermer le modal en cliquant à l'extérieur
        document.getElementById('share-modal').addEventListener('click', (e) => {
            if (e.target.id === 'share-modal') {
                closeShareModal();
            }
        });

        // ============================================
        // CRÉATION DES CARTES
        // ============================================
        function createBirthdayCard(user, index) {
            const nextBirthday = getNextBirthday(user.birthday);
            const currentAge = getAge(user.birthday);
            const upcomingAge = currentAge + 1;
            const countdown = getCountdown(nextBirthday);
            
            return `
                <div class="birthday-card" style="animation-delay: ${index * 0.1}s">
                    <div class="avatar-container">
                        ${createAvatarHTML(user)}
                    </div>
                    <div class="card-content">
                        <h3 class="pseudo">${user.pseudo}</h3>
                        <div class="user-info">
                            <p class="birthday-date">
                                📆 ${user.birthday.day} ${monthNames[user.birthday.month - 1]} ${user.birthday.year}
                            </p>
                            <div class="age-info">
                                <span class="current-age">🎂 ${currentAge} ans</span>
                                <span class="arrow">→</span>
                                <span class="upcoming-age">${upcomingAge} ans</span>
                            </div>
                        </div>
                        <div class="countdown" data-target="${nextBirthday.toISOString()}">
                            <div class="countdown-item">
                                <div class="countdown-value days">${countdown.days}</div>
                                <div class="countdown-label">Jours</div>
                            </div>
                            <div class="countdown-item">
                                <div class="countdown-value hours">${countdown.hours}</div>
                                <div class="countdown-label">Heures</div>
                            </div>
                            <div class="countdown-item">
                                <div class="countdown-value minutes">${countdown.minutes}</div>
                                <div class="countdown-label">Min</div>
                            </div>
                            <div class="countdown-item">
                                <div class="countdown-value seconds">${countdown.seconds}</div>
                                <div class="countdown-label">Sec</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function createTodayCard(user) {
            const age = getAge(user.birthday);
            const userIndex = users.indexOf(user);
            
            return `
                <section class="today-section">
                    <h2 class="section-title">
                        <span class="emoji">🎉</span>
                        C'est aujourd'hui !
                    </h2>
                    <div class="birthday-today">
                        <div class="avatar-container">
                            ${createAvatarHTML(user, 100)}
                        </div>
                        <div class="info">
                            <h3>🎂 ${user.pseudo}</h3>
                            <p class="today-main">Fête ses <span class="age-highlight">${age} ans</span> aujourd'hui !</p>
                            <p class="today-details">
                                <span class="detail-item">📅 Né(e) le ${user.birthday.day} ${monthNames[user.birthday.month - 1]} ${user.birthday.year}</span>
                            </p>
                            <div class="share-buttons">
                                <button class="share-btn share-btn-primary" onclick="openShareModal(users[${userIndex}])">
                                    🎁 Créer une carte de vœux
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        function calculateStats() {
            const ages = users.map(u => getAge(u.birthday));
            const totalUsers = users.length;
            const averageAge = (ages.reduce((a, b) => a + b, 0) / totalUsers).toFixed(1);
            const youngestAge = Math.min(...ages);
            const oldestAge = Math.max(...ages);
            const youngestUser = users.find(u => getAge(u.birthday) === youngestAge);
            const oldestUser = users.find(u => getAge(u.birthday) === oldestAge);
            
            const upcomingBirthdays = users.filter(u => !isBirthdayToday(u.birthday));
            upcomingBirthdays.sort((a, b) => getNextBirthday(a.birthday) - getNextBirthday(b.birthday));
            const nextBirthdayUser = upcomingBirthdays[0];
            const daysUntilNext = nextBirthdayUser ? Math.ceil((getNextBirthday(nextBirthdayUser.birthday) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
            
            const monthCounts = {};
            users.forEach(u => {
                const month = u.birthday.month;
                monthCounts[month] = (monthCounts[month] || 0) + 1;
            });
            const topMonth = Object.entries(monthCounts).sort((a, b) => b[1] - a[1])[0];
            
            const todayCount = users.filter(u => isBirthdayToday(u.birthday)).length;

            return {
                totalUsers,
                averageAge,
                youngestAge,
                oldestAge,
                youngestUser,
                oldestUser,
                nextBirthdayUser,
                daysUntilNext,
                topMonth: topMonth ? { month: parseInt(topMonth[0]), count: topMonth[1] } : null,
                todayCount
            };
        }

        function renderStats() {
            const stats = calculateStats();
            const statsGrid = document.getElementById('stats-grid');
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-value">${stats.totalUsers}</div>
                    <div class="stat-label">Membres</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-value">${stats.averageAge}</div>
                    <div class="stat-label">Âge moyen</div>
                    <div class="stat-sublabel">ans</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👶</div>
                    <div class="stat-value">${stats.youngestAge}</div>
                    <div class="stat-label">Plus jeune</div>
                    <div class="stat-sublabel">${stats.youngestUser?.pseudo || ''}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👴</div>
                    <div class="stat-value">${stats.oldestAge}</div>
                    <div class="stat-label">Plus âgé</div>
                    <div class="stat-sublabel">${stats.oldestUser?.pseudo || ''}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏳</div>
                    <div class="stat-value">${stats.daysUntilNext}</div>
                    <div class="stat-label">Jours avant</div>
                    <div class="stat-sublabel">${stats.nextBirthdayUser?.pseudo || ''}</div>
                </div>
            `;
        }

        let confetti = null;

        function renderBirthdays() {
            const todayContainer = document.getElementById('today-container');
            const grid = document.getElementById('birthday-grid');
            
            const todayBirthdays = users.filter(u => isBirthdayToday(u.birthday));
            const upcomingBirthdays = users.filter(u => !isBirthdayToday(u.birthday));
            
            upcomingBirthdays.sort((a, b) => {
                return getNextBirthday(a.birthday) - getNextBirthday(b.birthday);
            });
            
            if (todayBirthdays.length > 0) {
                todayContainer.innerHTML = todayBirthdays.map(u => createTodayCard(u)).join('');
                
                const canvas = document.getElementById('confetti-canvas');
                confetti = new Confetti(canvas);
                confetti.start();
            }
            
            if (upcomingBirthdays.length > 0) {
                grid.innerHTML = upcomingBirthdays.map((user, index) => createBirthdayCard(user, index)).join('');
            } else {
                grid.innerHTML = '<div class="no-birthdays">Aucun anniversaire à venir</div>';
            }
        }

        function updateCountdowns() {
            document.querySelectorAll('.countdown, .top3-countdown').forEach(el => {
                const cd = getCountdown(new Date(el.dataset.target));
                el.querySelector('.days').textContent = cd.days;
                el.querySelector('.hours').textContent = cd.hours;
                el.querySelector('.minutes').textContent = cd.minutes;
                el.querySelector('.seconds').textContent = cd.seconds;
            });
        }

        function createTop3Tile(user, rank) {
            const next = getNextBirthday(user.birthday);
            const upcomingAge = getAge(user.birthday) + 1;
            const cd = getCountdown(next);

            const imageHTML = user.avatar
                ? `<img src="${user.avatar}" class="top3-tile-image"
                     onerror="this.outerHTML='<div class=\\'top3-tile-placeholder\\'>${user.pseudo.charAt(0)}</div>'">`
                : `<div class="top3-tile-placeholder">${formatPseudo(user).charAt(0)}</div>`;

            return `
                <div class="top3-tile-wrapper">
                    <div class="top3-tile-link">
                        <div class="top3-rank-container">
                            <img src="${rank}.png" class="rank-image" alt="${rank}" onerror="this.outerHTML='<span style=\\'font-size:4rem;font-weight:800;color:#e50914;\\'>${rank}</span>'">
                        </div>

                        <div class="top3-image-container">
                            ${imageHTML}

                            <div class="top3-tile-overlays">
                                <div class="top3-tile-header">
                                    <p class="top3-tile-name">${formatPseudo(user)}</p>
                                    <span class="top3-age-badge">${upcomingAge} ans</span>
                                </div>

                                <p class="top3-tile-date">
                                    📅 ${user.birthday.day} ${monthNames[user.birthday.month - 1]}
                                </p>

                                <div class="top3-countdown" data-target="${next.toISOString()}">
                                    <div class="top3-countdown-item">
                                        <div class="top3-countdown-value days">${cd.days}</div>
                                        <div class="top3-countdown-label">J</div>
                                    </div>
                                    <div class="top3-countdown-item">
                                        <div class="top3-countdown-value hours">${cd.hours}</div>
                                        <div class="top3-countdown-label">H</div>
                                    </div>
                                    <div class="top3-countdown-item">
                                        <div class="top3-countdown-value minutes">${cd.minutes}</div>
                                        <div class="top3-countdown-label">M</div>
                                    </div>
                                    <div class="top3-countdown-item">
                                        <div class="top3-countdown-value seconds">${cd.seconds}</div>
                                        <div class="top3-countdown-label">S</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTop3() {
            const list = document.getElementById('top3-list');

            const upcoming = users
                .filter(u => !isBirthdayToday(u.birthday))
                .sort((a, b) =>
                    getNextBirthday(a.birthday) - getNextBirthday(b.birthday)
                );

            list.innerHTML = upcoming
                .slice(0, 3)
                .map((u, i) => createTop3Tile(u, i + 1))
                .join('');
        }

        // Initialisation
        createStars();
        renderStats();
        renderTop3();
        renderBirthdays();
        setInterval(updateCountdowns, 1000);
    </script>
