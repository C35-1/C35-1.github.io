<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Anniversaires à Venir</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --accent-red: #e50914;
            --accent-red-light: #ff3d47;
            --accent-purple: #b4a7d6;
            --accent-gold: #c9a227;
            --text-primary: #ffffff;
            --text-secondary: #808080;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.3;
            animation: float 25s ease-in-out infinite;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: #e50914;
            top: -300px;
            right: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #831010;
            bottom: -200px;
            left: -200px;
            animation-delay: -8s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: #e50914;
            top: 50%;
            left: 50%;
            opacity: 0.15;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(60px, -40px) scale(1.1) rotate(5deg); }
            50% { transform: translate(-40px, 60px) scale(0.95) rotate(-5deg); }
            75% { transform: translate(-60px, -30px) scale(1.05) rotate(3deg); }
        }

        .container {
            
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -1px;
            text-shadow: 0 0 40px rgba(229, 9, 20, 0.5);
        }

        .subtitle {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .stats-section {
            margin-bottom: 50px;
        }

        .stats-grid {
            
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(229, 9, 20, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-red);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-sublabel {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
            opacity: 0.7;
        }

        .today-section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
        }

        .section-title .emoji {
            font-size: 1.3rem;
        }

        .birthday-today {
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.2), rgba(131, 16, 16, 0.15), rgba(0, 0, 0, 0.3));
            border: 1px solid rgba(229, 9, 20, 0.5);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            animation: pulse-glow 3s ease-in-out infinite, fadeInUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .birthday-today::before {
            content: '🎉';
            position: absolute;
            font-size: 10rem;
            opacity: 0.05;
            right: -30px;
            top: -30px;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 30px rgba(229, 9, 20, 0.2); }
            50% { box-shadow: 0 0 50px rgba(229, 9, 20, 0.4); }
        }

        .birthday-today .avatar {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--accent-red);
            flex-shrink: 0;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.4);
        }

        .birthday-today .avatar-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.4);
        }

        .birthday-today .info h3 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #ffffff;
            font-weight: 700;
        }

        .birthday-today .info .today-main {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .birthday-today .info .age-highlight {
            color: var(--accent-red);
            font-weight: 700;
            font-size: 1.3rem;
        }

        .birthday-today .info .today-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 8px;
        }

        .birthday-today .info .detail-item {
            color: var(--text-secondary);
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .birthday-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        .birthday-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            gap: 20px;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out backwards;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .birthday-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-red), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .birthday-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.08), transparent 50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .birthday-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(229, 9, 20, 0.15);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
        }

        .birthday-card:hover::before,
        .birthday-card:hover::after {
            opacity: 1;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-container {
            position: relative;
            flex-shrink: 0;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            border: none;
            background: var(--bg-card);
            transition: all 0.3s ease;
        }

        .birthday-card:hover .avatar {
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        .avatar-placeholder {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            background: linear-gradient(135deg, #e50914, #831010);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .pseudo {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .birthday-date {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info {
            margin-bottom: 15px;
        }

        .age-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .current-age {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .arrow {
            font-weight: bold;
            color: var(--text-secondary);
        }


        .upcoming-age {
            background: rgba(58, 58, 58, 0.479);
            padding: 3px 10px;
            box-shadow: inset 0 0 5px rgb(255, 255, 255);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.95rem;

        }

        .age-badge {

            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .countdown {
            display: flex;
            gap: 8px;
        }

        .countdown-item {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 10px 8px;
            border-radius: 8px;
            min-width: 50px;
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .countdown-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
        }

        .countdown-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 5px;
        }

        .countdown-label {
            font-size: 0.55rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 3px;
        }

        .no-birthdays {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        
        
         /* ============================================
   TOP 3 SECTION - HBO MAX STYLE 
   OUTLINE CHROME EFFECT
   ============================================ */
.top3-section { margin-bottom: 50px; }

.top3-list {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding: 20px 0;
    scrollbar-width: none;
}
.top3-list::-webkit-scrollbar { display: none; }

.top3-tile-wrapper {
    transition: transform 0.3s ease;
    position: relative;
} 

.top3-tile-wrapper:hover {
    transform: translateY(-5px);
}

.top3-tile-link {
    display: flex;
    align-items: flex-end;
    text-decoration: none;
    color: inherit;
    transition: transform 0.3s ease;
}
.top3-tile-link:hover { transform: scale(1.05); }

/* Chiffre du top 3 */
.top3-rank-container {
    position: relative;
    flex-shrink: 0;
    margin-right: -16px;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    padding-bottom: 10px;
    width: 120px;

    transition: transform 0.3s ease; /* ajout pour l'effet */
}

/* Quand on survole la tuile */
.top3-tile-wrapper:hover .top3-rank-container {
    transform: translateX(-15px); /* décalage vers la gauche + léger zoom */
}

.top3-tile-wrapper:hover .top3-image-container {
    box-shadow: 0 0 0px rgba(0, 0, 0, 0.1);
}

.rank-image {
    width: 100%;
    height: auto;
    filter: drop-shadow(3px 4px 6px rgba(0,0,0,0.6));
}

/* Carte image */
.top3-image-container {
    position: relative;
    width: 300px;
    height: auto;
    border-radius: 12px;
    overflow: hidden;
    background: #0d0d0d;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
    isolation: isolate;
}

.top3-image-container::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    pointer-events: none;
    z-index: 15;
}

.top3-tile-image {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    display: block;
    position: relative;
    z-index: 1;
}

.top3-tile-placeholder {
    width: 100%;
    aspect-ratio: 2/3;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    font-weight: 700;
    color: rgba(255,255,255,0.08);
}

.top3-tile-overlays {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px;
    background: linear-gradient(
        to top,
        rgba(30,30,35,1) 0%,    /* bas très sombre */
        rgba(30,30,35,0.95) 20%, 
        rgba(30,30,35,0.9) 40%, 
        rgba(30,30,35,0.7) 60%, 
        rgba(30,30,35,0.4) 80%, 
        transparent 100%
    );
    z-index: 10;
}




.top3-tile-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
}

.top3-tile-name {
    font-size: 1.2rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.top3-age-badge {
    background: rgba(58, 58, 58, 0.479);
            padding: 3px 10px;
            box-shadow: inset 0 0 5px rgb(0, 0, 0);
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 1000;
}



.top3-tile-date {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.7);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* Countdown */
.top3-countdown {
    display: flex;
    gap: 6px;
}

.top3-countdown-item {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 0;
    border-radius: 6px;
    text-align: center;
    flex: 1;
}

.top3-countdown-value {
    font-size: 1.1rem;
    font-weight: 700;
}

.top3-countdown-label {
    font-size: 0.55rem;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-top: 4px;
}


/* MOBILE GLOBAL */
@media (max-width: 768px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 20px 10px;
    }

    header .title {
        font-size: clamp(2rem, 8vw, 3rem);
    }

    header .subtitle {
        font-size: 0.9rem;
    }

    /* GRID BIRTHDAY */
    .birthday-grid {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    /* CARTE ANNIVERSAIRE */
    .birthday-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 20px;
    }

    .birthday-card .card-content {
        width: 100%;
    }

    .birthday-card .avatar, .birthday-today .avatar {
        width: 80px;
        height: 80px;
    }

    .birthday-today {
        flex-direction: column;
        text-align: center;
    }

    .today-details {
        justify-content: center;
    }

    /* COUNTDOWN */
    .countdown {
        justify-content: center;
        gap: 5px;
    }

    .countdown-item {
        padding: 8px 6px;
        min-width: 40px;
    }

    .countdown-value {
        font-size: 1.2rem;
    }

    .countdown-label {
        font-size: 0.5rem;
    }


    /* STAT CARDS */
    .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .stat-card {
        padding: 15px;
    }

    .stat-value {
        font-size: 1.8rem;
    }

    .stat-label, .stat-sublabel {
        font-size: 0.75rem;
    }
}

/* EXTRA SMALL SCREEN (< 400px) */
@media (max-width: 400px) {
    header .title {
        font-size: 2rem;
    }

    .birthday-card .avatar {
        width: 70px;
        height: 70px;
    }

    .birthday-today .avatar {
        width: 70px;
        height: 70px;
    }

    .countdown-value {
        font-size: 1rem;
    }


    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    
    <div class="stars" id="stars"></div>
    
    <div class="background-effects">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header>
            <h1 class="title">Anniversaires</h1>
            <p class="subtitle">Ne manquez aucune célébration</p>
        </header>

        <div id="today-container"></div>

        <section class="stats-section">
            <h2 class="section-title">
                <span class="emoji">📊</span>
                Statistiques
            </h2>
            <div class="stats-grid" id="stats-grid"></div>
        </section>

        <section class="top3-section">
            <h2 class="section-title">
                <span class="emoji">🏆</span>
                Les 3 prochains anniversaires
            </h2>
            <div class="top3-list" id="top3-list"></div>
        </section>

        <section>
            <h2 class="section-title">
                <span class="emoji">📅</span>
                Prochains anniversaires
            </h2>
            <div class="birthday-grid" id="birthday-grid"></div>
        </section>
    </div>

    <script>
        // ============================================
        // SYSTÈME DE CONFETTIS RÉALISTES (Canvas)
        // ============================================
        class Confetti {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.colors = [
                    '#e50914', '#ff3d47', '#b20710', '#ffffff', '#cccccc', 
                    '#ff6b6b', '#c9a227', '#ffd700', '#ff4444', '#ff8080'
                ];
                this.running = false;
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            createParticle(x, y, isExplosion = false) {
                const color = this.colors[Math.floor(Math.random() * this.colors.length)];
                const shapeType = Math.random();
                let shape;
                if (shapeType < 0.3) shape = 'square';
                else if (shapeType < 0.5) shape = 'circle';
                else if (shapeType < 0.8) shape = 'ribbon';
                else shape = 'star';
                
                return {
                    x: x !== undefined ? x : Math.random() * this.canvas.width,
                    y: y !== undefined ? y : -20,
                    width: Math.random() * 12 + 6,
                    height: Math.random() * 8 + 4,
                    color: color,
                    shape: shape,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 15,
                    velocityX: isExplosion ? (Math.random() - 0.5) * 25 : (Math.random() - 0.5) * 4,
                    velocityY: isExplosion ? Math.random() * -18 - 8 : Math.random() * 3 + 2,
                    gravity: 0.12,
                    drag: 0.99,
                    opacity: 1,
                    wobble: Math.random() * 10,
                    wobbleSpeed: Math.random() * 0.15 + 0.05,
                    scale: isExplosion ? Math.random() * 0.5 + 0.8 : 1,
                    tilt: Math.random() * Math.PI
                };
            }

            drawParticle(p) {
                this.ctx.save();
                this.ctx.translate(p.x, p.y);
                this.ctx.rotate(p.rotation * Math.PI / 180);
                this.ctx.scale(p.scale, p.scale * Math.cos(p.tilt));
                this.ctx.globalAlpha = p.opacity;

                this.ctx.fillStyle = p.color;

                switch(p.shape) {
                    case 'square':
                        this.ctx.fillRect(-p.width / 2, -p.height / 2, p.width, p.height);
                        break;
                    case 'circle':
                        this.ctx.beginPath();
                        this.ctx.arc(0, 0, p.width / 2, 0, Math.PI * 2);
                        this.ctx.fill();
                        break;
                    case 'ribbon':
                        this.ctx.beginPath();
                        this.ctx.moveTo(-p.width / 2, -p.height / 2);
                        this.ctx.lineTo(p.width / 2, -p.height / 4);
                        this.ctx.lineTo(p.width / 2, p.height / 2);
                        this.ctx.lineTo(-p.width / 2, p.height / 4);
                        this.ctx.closePath();
                        this.ctx.fill();
                        break;
                    case 'star':
                        this.drawStar(0, 0, 5, p.width / 2, p.width / 4);
                        break;
                }

                this.ctx.restore();
            }

            drawStar(cx, cy, spikes, outerRadius, innerRadius) {
                let rot = Math.PI / 2 * 3;
                let step = Math.PI / spikes;

                this.ctx.beginPath();
                this.ctx.moveTo(cx, cy - outerRadius);

                for (let i = 0; i < spikes; i++) {
                    let x = cx + Math.cos(rot) * outerRadius;
                    let y = cy + Math.sin(rot) * outerRadius;
                    this.ctx.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    this.ctx.lineTo(x, y);
                    rot += step;
                }

                this.ctx.lineTo(cx, cy - outerRadius);
                this.ctx.closePath();
                this.ctx.fill();
            }

            updateParticle(p) {
                p.velocityY += p.gravity;
                p.velocityX *= p.drag;
                p.velocityY *= p.drag;

                p.x += p.velocityX + Math.sin(p.wobble) * 2;
                p.y += p.velocityY;
                p.rotation += p.rotationSpeed;
                p.wobble += p.wobbleSpeed;
                p.tilt += 0.05;

                if (p.y > this.canvas.height - 150) {
                    p.opacity -= 0.015;
                }

                return p.y < this.canvas.height + 50 && p.opacity > 0;
            }

            burst(x, y, count = 60) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(this.createParticle(x, y, true));
                }
            }

            startContinuous() {
                this.running = true;
                this.continuousInterval = setInterval(() => {
                    if (this.running && this.particles.length < 200) {
                        // Ajouter des confettis depuis le haut
                        this.particles.push(this.createParticle());
                        if (Math.random() > 0.5) {
                            this.particles.push(this.createParticle());
                        }
                    }
                }, 80);
            }

            stop() {
                this.running = false;
                clearInterval(this.continuousInterval);
                clearInterval(this.burstInterval);
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.particles = this.particles.filter(p => {
                    this.drawParticle(p);
                    return this.updateParticle(p);
                });

                requestAnimationFrame(() => this.animate());
            }

            start() {
                this.animate();
                this.startContinuous();
                
                // Explosions périodiques depuis les côtés
                this.burstInterval = setInterval(() => {
                    if (this.running) {
                        const side = Math.random() > 0.5;
                        const x = side ? this.canvas.width * 0.1 : this.canvas.width * 0.9;
                        this.burst(x, this.canvas.height * 0.3, 40);
                    }
                }, 4000);

                // Explosions initiales
                setTimeout(() => {
                    this.burst(this.canvas.width * 0.3, this.canvas.height * 0.2, 70);
                }, 300);
                setTimeout(() => {
                    this.burst(this.canvas.width * 0.7, this.canvas.height * 0.25, 70);
                }, 600);
                setTimeout(() => {
                    this.burst(this.canvas.width * 0.5, this.canvas.height * 0.15, 80);
                }, 900);
            }
        }

        function getNextBirthday(birthday) {
            const now = new Date();
            const thisYear = now.getFullYear();
            let nextBirthday = new Date(thisYear, birthday.month - 1, birthday.day);
            
            if (nextBirthday < now && !(nextBirthday.toDateString() === now.toDateString())) {
                nextBirthday = new Date(thisYear + 1, birthday.month - 1, birthday.day);
            }
            
            return nextBirthday;
        }

         

        function getAge(birthday) {
            const now = new Date();
            let age = now.getFullYear() - birthday.year;
            const monthDiff = now.getMonth() + 1 - birthday.month;
            if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < birthday.day)) {
                age--;
            }
            return age;
        }

        function isBirthdayToday(birthday) {
            const now = new Date();
            return birthday.day === now.getDate() && birthday.month === (now.getMonth() + 1);
        }

        function getCountdown(targetDate) {
            const now = new Date();
            const diff = targetDate - now;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            return { days, hours, minutes, seconds };
        }

        function calculateStats() {
            const ages = users.map(u => getAge(u.birthday));
            const totalUsers = users.length;
            const averageAge = (ages.reduce((a, b) => a + b, 0) / totalUsers).toFixed(1);
            const youngestAge = Math.min(...ages);
            const oldestAge = Math.max(...ages);
            const youngestUser = users.find(u => getAge(u.birthday) === youngestAge);
            const oldestUser = users.find(u => getAge(u.birthday) === oldestAge);
            
            // Prochain anniversaire
            const upcomingBirthdays = users.filter(u => !isBirthdayToday(u.birthday));
            upcomingBirthdays.sort((a, b) => getNextBirthday(a.birthday) - getNextBirthday(b.birthday));
            const nextBirthdayUser = upcomingBirthdays[0];
            const daysUntilNext = nextBirthdayUser ? Math.ceil((getNextBirthday(nextBirthdayUser.birthday) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
            
            // Mois avec le plus d'anniversaires
            const monthCounts = {};
            users.forEach(u => {
                const month = u.birthday.month;
                monthCounts[month] = (monthCounts[month] || 0) + 1;
            });
            const topMonth = Object.entries(monthCounts).sort((a, b) => b[1] - a[1])[0];
            
            // Anniversaires aujourd'hui
            const todayCount = users.filter(u => isBirthdayToday(u.birthday)).length;

            return {
                totalUsers,
                averageAge,
                youngestAge,
                oldestAge,
                youngestUser,
                oldestUser,
                nextBirthdayUser,
                daysUntilNext,
                topMonth: topMonth ? { month: parseInt(topMonth[0]), count: topMonth[1] } : null,
                todayCount
            };
        }

function formatPseudo(user) {
    const parts = user.pseudo.trim().split(' ');
    if (parts.length === 1) return parts[0]; // juste le prénom
    const firstName = parts[0];
    const lastInitial = parts[1].charAt(0).toUpperCase();
    return `${firstName} ${lastInitial}.`;
}



function renderTop3() {

    list.innerHTML = upcoming
        .slice(0, 3)
        .map((u, i) => createTop3Tile(u, i + 1))
        .join('');
}
