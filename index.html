                container.innerHTML = todayBirthdays.map(createTodayCard).join('');
                if (!mainConfetti) {
                    mainConfetti = new Confetti(document.getElementById('confetti-canvas'));
                    mainConfetti.start();
                }
            } else {
                container.innerHTML = '';
            }
        }

        function renderTop3() {
            const upcoming = users.filter(u => !isBirthdayToday(u.birthday))
                .sort((a, b) => getNextBirthday(a.birthday) - getNextBirthday(b.birthday));
            const list = document.getElementById('top3-list');
            list.innerHTML = upcoming.slice(0, 3).map((u, i) => createTop3Tile(u, i + 1)).join('');

            // Click handlers for TV mode
            list.querySelectorAll('.top3-tile').forEach(tile => {
                tile.addEventListener('click', (e) => {
                    e.preventDefault();
                    const idx = parseInt(tile.dataset.userIndex);
                    if (!isNaN(idx)) openTvMode(users[idx]);
                });
            });
        }

        function renderBirthdays() {
            const search = document.getElementById('search-input').value.trim().toLowerCase();
            const monthFilter = document.getElementById('filter-month').value;
            const sortBy = document.getElementById('sort-by').value;

            let filtered = users.filter(u => !isBirthdayToday(u.birthday));

            if (search) {
                filtered = filtered.filter(u =>
                    getFullName(u).toLowerCase().includes(search) ||
                    u.prenom.toLowerCase().includes(search) ||
                    u.nom.toLowerCase().includes(search)
                );
            }

            if (monthFilter !== 'all') {
                filtered = filtered.filter(u => u.birthday.month - 1 === parseInt(monthFilter));
            }

            document.getElementById('total-count').textContent =
                `${filtered.length} ${filtered.length > 1 ? 'PROFILS' : 'PROFIL'}`;

            const container = document.getElementById('birthdays-container');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-mark">∅</div>
                        <p>Aucun profil ne correspond.</p>
                    </div>
                `;
                initCountdownObserver();
                return;
            }

            if (sortBy === 'name') {
                filtered.sort((a, b) => getFullName(a).localeCompare(getFullName(b), 'fr'));
            } else if (sortBy === 'age-desc') {
                filtered.sort((a, b) => getAge(b.birthday) - getAge(a.birthday));
            } else if (sortBy === 'age-asc') {
                filtered.sort((a, b) => getAge(a.birthday) - getAge(b.birthday));
            } else {
                filtered.sort((a, b) => getNextBirthday(a.birthday) - getNextBirthday(b.birthday));
            }

            const groupByMonth = sortBy === 'upcoming' && !search && monthFilter === 'all';

            if (groupByMonth) {
                const groups = new Map();
                filtered.forEach(u => {
                    const m = u.birthday.month - 1;
                    if (!groups.has(m)) groups.set(m, []);
                    groups.get(m).push(u);
                });

                let html = '';
                let cardIndex = 0;
                const currentMonth = today.getMonth();
                groups.forEach((monthUsers, monthIdx) => {
                    const isCurrent = monthIdx === currentMonth;
                    html += `
                        <div class="month-section">
                            <div class="month-header">
                                <span class="month-num">N° ${pad(monthIdx + 1)}</span>
                                <h3 class="month-name${isCurrent ? ' current' : ''}">${monthNames[monthIdx]}</h3>
                                <span class="month-count">${monthUsers.length} ${monthUsers.length > 1 ? 'profils' : 'profil'}</span>
                            </div>
                            <div class="birthday-grid">
                                ${monthUsers.map(u => createBirthdayCard(u, cardIndex++)).join('')}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="birthday-grid">${filtered.map((u, i) => createBirthdayCard(u, i)).join('')}</div>`;
            }

            initCountdownObserver();
        }

        /* ============================================================
         * SCROLL TO TOP
         * ============================================================ */
        const scrollTopBtn = document.getElementById('scroll-top');
        let scrollTicking = false;
        window.addEventListener('scroll', () => {
            if (!scrollTicking) {
                requestAnimationFrame(() => {
                    scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
                    scrollTicking = false;
                });
                scrollTicking = true;
            }
        }, { passive: true });
        scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        /* ============================================================
         * TOOLBAR EVENTS
         * ============================================================ */
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const filterMonth = document.getElementById('filter-month');
        const sortBy = document.getElementById('sort-by');

        const debouncedRender = debounce(renderBirthdays, 200);

        searchInput.addEventListener('input', () => {
            searchClear.classList.toggle('visible', searchInput.value.length > 0);
            debouncedRender();
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            renderBirthdays();
            searchInput.focus();
        });

        filterMonth.addEventListener('change', renderBirthdays);
        sortBy.addEventListener('change', renderBirthdays);

        /* ============================================================
         * INIT
         * ============================================================ */
        setHeaderMeta();
        setInterval(setHeaderMeta, 10000);
        renderToday();
        renderTop3();
        renderLifetimeCard();
        renderCollisions();
        renderBirthdays();
        renderStats();

        setInterval(updateVisibleCountdowns, 1000);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
